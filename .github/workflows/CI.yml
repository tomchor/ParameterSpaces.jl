name: CI

#+++ Triggers
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
#---

#+++ Concurrency
# Cancel an in-progress run when a newer one starts on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
#---

jobs:
  #+++ test: Pkg.test on Julia 1.13
  test:
    name: Tests (Julia 1.13)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.13'

      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
  #---
